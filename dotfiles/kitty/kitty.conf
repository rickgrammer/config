# Enable Wayland (kitty supports it automatically if run under Wayland)
# Nothing extra is needed, but you can force:
wayland_enable yes

# Fonts with fallbacks
font_family      JetBrains Mono
font_family      Noto Sans Mono
font_family      Fira Code
font_size        11.5

# Transparency (background opacity)
background_opacity 0.85

# Window decorations
# Kitty does not allow removing borders in the same way as WezTerm.
# But you can control padding:
window_padding_width 5 5 2 2   # left right top bottom

# Cursor settings
cursor_shape block
cursor_blink_interval 0  # disables blinking (steady cursor)

# Key mappings
# Kitty doesn’t have a "copy mode" like WezTerm, but it has scrollback search.
# The closest equivalent:
map ctrl+shift+space show_scrollback

allow_remote_control yes

