# This is a simple hyprlock configuration.
# For more advanced options, refer to the hyprlock wiki:
# https://wiki.hyprland.org/Hypr-Ecosystem/Hyprlock/

# General settings
general {
    disable_loading_bar = true
    hide_cursor = false
}

# Background layer
background {
    path = auto # Automatically uses your current desktop wallpaper
    # or you can specify a path to an image:
    # path = ~/.config/hypr/wallpaper.jpg
    
    blur_passes = 1 # Number of blur passes. 0 for no blur, 1 for light blur, etc.
    blur_size = 7 # Size of the blur effect
    # noise = 0.01 # Add some noise to the blur (optional)
    # contrast = 0.8 # Adjust contrast (optional)
    # brightness = 0.8 # Adjust brightness (optional)
    # vignette = 0.5 # Add a vignette effect (optional)
}

# User input box (where you type your password)
input-field {
    monitor = 
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.3 # Password dots size (0 to 1)
    dots_spacing = 0.1 # Password dots spacing (0 to 1)
    dots_center = true
    inner_color = rgb(20, 20, 20) # Background color of the input field
    outer_color = rgb(100, 100, 100) # Outline color of the input field
    font_color = rgb(dddddd) # Color of the password dots/text
    fade_on_empty = true
    placeholder_text = <span foreground="##888888">Password...</span> # Text displayed when empty
    check_color = rgb(44ee44) # Color when password is correct
    fail_color = rgb(ee4444) # Color when password is incorrect
    fail_text = <span foreground="##ee4444">Wrong!</span> # Text displayed on incorrect password
    # hide_input = false # Set to true to hide the input text entirely (only dots)
    # position = 0, -100 # X, Y offset from center (e.g., -100px up)
}
# --- New Greeting Label ---
label {
    monitor = 
    text = خوش آمدید
    # You can also use: text = cmd[update:1] whoami | sed 's/.*/Hi, &!/'
    color = rgb(ffffff) # White color for the greeting
    font_size = 36
    font_family = sans-serif
    position = 0, 130 # Position it above the password field
    halign = center
    valign = center
}

# Time label
label {
    monitor = 
    text = cmd[update:1000] date +%H:%M:%S
    color = rgb(dddddd)
    font_size = 48
    font_family = sans-serif
    position = 0, -150 # Y-offset from center (positive is down)
    halign = center
    valign = center
}

# Date label
label {
    monitor = 
    text = cmd[update:1000] date +%A,\ %d\ %B
    color = rgb(dddddd)
    font_size = 24
    font_family = sans-serif
    position = 0, -100 # Y-offset from center
    halign = center
    valign = center
}

