# Preload your 5 images
# Make sure to replace these paths with the actual paths to your wallpaper images!

preload = ~/Pictures/Wallpapers/chris-saran-X4Dv9ftAhvQ-unsplash.jpg
preload = ~/Pictures/Wallpapers/filip-kvasnak-ThFBfl1JTI8-unsplash.jpg
preload = ~/Pictures/Wallpapers/pascal-debrunner-vwFvhJf6u_I-unsplash.jpg
preload = ~/Pictures/Wallpapers/pbd.jpg
preload = ~/Pictures/Wallpapers/scott-lord-NFFPYaWYQQk-unsplash.jpg

# Set one of the preloaded images as the initial wallpaper
# The 'monitor' field is empty to apply it to all monitors.
# You can also use 'contain:' or 'tile:' before the path if you don't want 'cover' (default)
wallpaper = ,~/Pictures/Wallpapers/filip-kvasnak-ThFBfl1JTI8-unsplash.jpg

# Optional: Enable IPC (Inter-Process Communication)
# This allows you to control hyprpaper using `hyprctl hyprpaper` commands,
# which is essential for changing wallpapers dynamically via scripts.
ipc = true

# Optional: Splash (Hyprland logo over wallpaper)
# splash = false # Set to true to enable Hyprland splash logo
# splash_offset = 2.0
# splash_color = 55ffffff
