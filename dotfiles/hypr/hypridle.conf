general {
  lock_cmd = pidof hyprlock || hyprlock

  # We explicitly lock the session here.
  before_sleep_cmd = loginctl lock-session 
  # Optional: Command to run *after* the system wakes up from sleep/suspend.
  # This example ensures the display is turned on.
  # after_sleep_cmd = hyprctl dispatch dpms on 
}

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600 # 10 minutes of inactivity
    on-timeout = loginctl lock-session # Lock the screen after 5 minutes
}

listener {
    timeout = 900 # 15 minutes of inactivity (after locking)
    # on-timeout = systemctl suspend # Suspend the system after 10 minutes
    # Optional: If you want to force screen off just before suspend
    on-timeout = hyprctl dispatch dpms off && systemctl suspend
}
